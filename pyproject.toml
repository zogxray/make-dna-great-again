[project]
name = "make-dna-great-again"
version = "0.1.0"
description = "Make DNA Great Again — local TUI for your genotype (Y tree, PGS, AADR)"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "numpy>=1.24",
    "google-genai>=1.0",
    "duckdb>=1.1",
    "pyarrow>=14",
    "pillow>=10",
]

[project.scripts]
ydna = "ydna.__main__:main"
mdga = "ydna.__main__:main"
ydna-mcp = "ydna.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.9,<2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ydna*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "local: uses private local data/; enable with MDGA_LOCAL_BENCH=1",
]
